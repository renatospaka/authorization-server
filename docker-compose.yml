  db:
    build: .docker/postgres
    container_name: postgres_interview_authorizations_db
    restart: unless-stopped
    tty: true
    ports:
      - 3201:5432
    volumes:
      - .docker/postgres/dbdata-authorization:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=authorizations
      - POSTGRES_USER=authorization
      - POSTGRES_PASSWORD=thisislocal-noneedtoworry
    extra_hosts:
      - "host.docker.internal:172.17.0.1"

networks:
  cred_system_network:
    driver: bridge
